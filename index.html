<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>English Vault — Vocabulary & Grammar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,600;1,400&display=swap');

  :root {
    --bg: #0f0f13;
    --bg2: #16161d;
    --bg3: #1e1e28;
    --bg4: #252532;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0eff8;
    --text2: #9896b0;
    --text3: #5e5c74;
    --accent: #7c6ff7;
    --accent2: #a89ef9;
    --accent-bg: rgba(124,111,247,0.12);
    --accent-bg2: rgba(124,111,247,0.22);
    --green: #3ecf8e;
    --green-bg: rgba(62,207,142,0.12);
    --red: #f87171;
    --red-bg: rgba(248,113,113,0.12);
    --amber: #fbbf24;
    --amber-bg: rgba(251,191,36,0.1);
    --radius: 12px;
    --radius-sm: 8px;
  }

  html.light {
    --bg: #f5f4fb;
    --bg2: #ffffff;
    --bg3: #f0effe;
    --bg4: #e8e6fd;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.14);
    --text: #1a1830;
    --text2: #5a5680;
    --text3: #a09cbe;
    --accent: #6c5ff5;
    --accent2: #5548e0;
    --accent-bg: rgba(108,95,245,0.08);
    --accent-bg2: rgba(108,95,245,0.16);
    --green: #16a364;
    --green-bg: rgba(22,163,100,0.1);
    --red: #dc3545;
    --red-bg: rgba(220,53,69,0.1);
    --amber: #d97706;
    --amber-bg: rgba(217,119,6,0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  /* LAYOUT */
  .layout { display: flex; min-height: 100vh; }

  .sidebar {
    width: 220px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 24px 0;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 50;
  }

  .logo {
    padding: 0 20px 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .logo-mark {
    font-family: 'Lora', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.5px;
  }
  .logo-mark span { color: var(--accent2); }
  .logo-sub { font-size: 11px; color: var(--text3); margin-top: 2px; letter-spacing: 0.06em; text-transform: uppercase; }

  .nav { flex: 1; padding: 0 12px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--text2);
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 2px;
    transition: all 0.15s;
    border: 1px solid transparent;
    -webkit-appearance: none; appearance: none;
    background: none; outline: none;
    font-family: inherit; width: 100%; text-align: left;
    flex-direction: row; height: auto;
    touch-action: manipulation;
  }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active { background: var(--accent-bg); color: var(--accent2); border-color: rgba(124,111,247,0.2); }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; pointer-events: none; }
  .nav-item span { pointer-events: none; }
  /* Desktop: show full label, hide short */
  .nav-full { display: inline; font-size: 13px; font-weight: 500; }
  .nav-short { display: none; }

  .nav-section { font-size: 10px; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; padding: 12px 12px 6px; }

  .sidebar-stats {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    margin-top: auto;
  }
  .sidebar-stat { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .sidebar-stat-label { font-size: 12px; color: var(--text3); }
  .sidebar-stat-val { font-size: 13px; font-weight: 600; color: var(--text2); }

  .main {
    margin-left: 220px;
    flex: 1;
    min-height: 100vh;
  }

  .topbar { padding: 20px 32px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--bg); position: sticky; top: 0; z-index: 40; gap: 12px; }
  .page-title { font-size: 18px; font-weight: 600; color: var(--text); white-space: nowrap; }
  .page-title span { color: var(--text3); font-weight: 400; font-size: 14px; margin-left: 8px; }
  .topbar-actions { display: flex; gap: 10px; align-items: center; }

  .content { padding: 28px 32px; }

  /* BUTTONS */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500; cursor: pointer;
    border: 1px solid transparent; transition: all 0.15s;
  }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: #6a5ef0; }
  .btn-ghost { background: transparent; color: var(--text2); border-color: var(--border2); }
  .btn-ghost:hover { background: var(--bg3); color: var(--text); }
  .btn-danger { background: transparent; color: var(--red); border-color: rgba(248,113,113,0.3); }
  .btn-danger:hover { background: var(--red-bg); }
  .btn svg { width: 14px; height: 14px; }

  /* SEARCH */
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text3); }
  .search-input {
    width: 280px; padding: 8px 12px 8px 36px;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text);
    font-size: 13px; font-family: inherit;
    transition: border-color 0.15s;
  }
  .search-input:focus { outline: none; border-color: var(--accent); }
  .search-input::placeholder { color: var(--text3); }

  /* TOPIC PILLS */
  .topic-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .topic-pill {
    padding: 4px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--border); color: var(--text2);
    background: transparent; transition: all 0.15s;
    display: flex; align-items: center; gap: 5px;
  }
  .topic-pill:hover { border-color: var(--border2); color: var(--text); }
  .topic-pill.active { background: var(--accent-bg); color: var(--accent2); border-color: rgba(124,111,247,0.3); }
  .topic-dot { width: 6px; height: 6px; border-radius: 50%; }

  /* CARDS GRID */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }

  .vocab-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
    position: relative;
    overflow: hidden;
  }
  .vocab-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: var(--card-accent, var(--accent));
    opacity: 0.6;
  }
  .vocab-card:hover { border-color: var(--border2); transform: translateY(-1px); }

  .card-actions { position: absolute; top: 10px; right: 10px; display: none; gap: 4px; }
  .vocab-card:hover .card-actions { display: flex; }
  .icon-btn {
    width: 26px; height: 26px; border-radius: 6px;
    background: var(--bg3); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text2); transition: all 0.15s;
  }
  .icon-btn svg { width: 12px; height: 12px; }
  .icon-btn:hover { background: var(--bg4); color: var(--text); }
  .icon-btn.del:hover { background: var(--red-bg); color: var(--red); border-color: rgba(248,113,113,0.3); }

  .vc-word { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .vc-phonetic { font-size: 12px; color: var(--accent2); margin-bottom: 8px; font-style: italic; }
  .vc-type {
    display: inline-block; font-size: 10px; font-weight: 600;
    padding: 2px 7px; border-radius: 20px; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .vc-meaning { font-size: 13px; color: var(--text2); line-height: 1.5; }
  .vc-example { font-size: 12px; color: var(--text3); font-style: italic; margin-top: 6px; line-height: 1.4; }
  .vc-topic { display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; font-size: 11px; padding: 2px 8px; border-radius: 20px; }

  /* STRUCT CARDS */
  .struct-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px;
    margin-bottom: 10px; position: relative;
    transition: border-color 0.15s;
  }
  .struct-card:hover { border-color: var(--border2); }
  .sc-name { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .sc-pattern {
    font-family: 'Lora', serif; font-size: 13px; color: var(--accent2);
    background: var(--accent-bg); padding: 8px 14px;
    border-radius: var(--radius-sm); display: block;
    margin-bottom: 10px; border-left: 3px solid var(--accent);
    line-height: 1.7; white-space: pre-wrap; word-break: break-word;
  }
  .sc-meaning { font-size: 13px; color: var(--text2); margin-bottom: 6px; }
  .sc-example { font-size: 13px; color: var(--text3); font-style: italic; }

  /* TOPIC MANAGE */
  .topics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .topic-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topic-card-left { display: flex; align-items: center; gap: 12px; }
  .topic-swatch { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; }
  .topic-card-name { font-size: 14px; font-weight: 500; }
  .topic-card-count { font-size: 12px; color: var(--text3); margin-top: 2px; }

  /* MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); z-index: 200;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg2); border: 1px solid var(--border2);
    border-radius: 16px; padding: 28px;
    width: 100%; max-width: 500px;
    max-height: 90vh; overflow-y: auto;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .modal-title { font-size: 17px; font-weight: 600; }
  .modal-close { background: none; border: none; color: var(--text3); cursor: pointer; padding: 4px; }
  .modal-close:hover { color: var(--text); }
  .modal-close svg { width: 18px; height: 18px; }

  .form-row { margin-bottom: 16px; }
  .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
  .form-input, .form-select, .form-textarea {
    width: 100%; padding: 9px 12px;
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: var(--radius-sm); color: var(--text);
    font-size: 13px; font-family: inherit;
    transition: border-color 0.15s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--accent); }
  .form-textarea { height: 80px; resize: vertical; }
  .form-select option { background: var(--bg3); }
  .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

  /* COLOR PICKER */
  .color-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .color-swatch {
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: transform 0.1s;
  }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.selected { border-color: #fff; }

  /* TYPE BADGES */
  .type-noun { background: rgba(62,207,142,0.15); color: #3ecf8e; border: 1px solid rgba(62,207,142,0.3); }
  .type-verb { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
  .type-adj  { background: rgba(248,113,113,0.15); color: #f87171; border: 1px solid rgba(248,113,113,0.3); }
  .type-adv  { background: rgba(124,111,247,0.2);  color: #a89ef9; border: 1px solid rgba(124,111,247,0.3); }
  .type-phrase { background: rgba(56,189,248,0.15); color: #38bdf8; border: 1px solid rgba(56,189,248,0.3); }
  .type-other  { background: rgba(148,163,184,0.15); color: #94a3b8; border: 1px solid rgba(148,163,184,0.25); }

  .vc-type { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 8px; letter-spacing: 0.04em; }

  /* TYPE FILTER ROW */
  .type-filter-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .type-fpill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 11px; border-radius: 20px; font-size: 12px; font-weight: 600;
    cursor: pointer; border: 1px solid transparent; transition: all 0.15s; opacity: 0.5;
  }
  .type-fpill:hover { opacity: 0.85; }
  .type-fpill.active { opacity: 1; }
  .type-fpill-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  /* WORDTYPE PANEL */
  .wt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .wt-card {
    border-radius: var(--radius); padding: 20px;
    border: 1px solid; position: relative; overflow: hidden;
  }
  .wt-card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .wt-icon {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .wt-card-name { font-size: 15px; font-weight: 600; }
  .wt-card-en { font-size: 12px; opacity: 0.7; margin-top: 1px; }
  .wt-desc { font-size: 13px; line-height: 1.6; color: var(--text2); margin-bottom: 10px; }
  .wt-examples { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .wt-ex-word { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
  .wt-count { font-size: 12px; font-weight: 600; margin-top: 10px; padding-top: 10px; border-top: 1px solid; }
  .wt-section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: var(--text); }
  .wt-vocab-mini { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }

  /* EMPTY STATE */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
  .empty-state svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.3; }
  .empty-state p { font-size: 14px; }

  /* QUIZ */
  .quiz-setup { max-width: 480px; margin: 0 auto; }
  .quiz-option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .quiz-option-card {
    background: var(--bg2); border: 2px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; cursor: pointer;
    transition: all 0.15s; text-align: center;
  }
  .quiz-option-card:hover { border-color: var(--accent); }
  .quiz-option-card.selected { border-color: var(--accent); background: var(--accent-bg); }
  .quiz-option-card .qoc-icon { font-size: 24px; margin-bottom: 6px; }
  .quiz-option-card .qoc-label { font-size: 13px; font-weight: 500; }
  .quiz-option-card .qoc-desc { font-size: 11px; color: var(--text3); margin-top: 3px; }

  .quiz-container { max-width: 600px; margin: 0 auto; }
  .quiz-progress-bar { height: 3px; background: var(--bg3); border-radius: 2px; margin-bottom: 28px; overflow: hidden; }
  .quiz-progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }
  .quiz-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; color: var(--text3); }

  .quiz-card {
    background: var(--bg2); border: 1px solid var(--border2);
    border-radius: 16px; padding: 32px;
    margin-bottom: 20px; text-align: center;
  }
  .quiz-card-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
  .quiz-card-word { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
  .quiz-card-hint { font-size: 13px; color: var(--accent2); font-style: italic; }
  .quiz-card-phonetic { font-size: 14px; color: var(--text3); margin-top: 6px; }

  .quiz-answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .quiz-answer {
    background: var(--bg2); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 14px 16px;
    cursor: pointer; font-size: 14px; text-align: left;
    transition: all 0.15s; line-height: 1.4;
  }
  .quiz-answer:hover:not(.disabled) { border-color: var(--accent); background: var(--accent-bg); }
  .quiz-answer.correct { border-color: var(--green); background: var(--green-bg); color: var(--green); }
  .quiz-answer.wrong { border-color: var(--red); background: var(--red-bg); color: var(--red); }
  .quiz-answer.disabled { cursor: default; }

  .quiz-feedback {
    background: var(--bg3); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 16px; font-size: 13px;
    color: var(--text2); display: none; line-height: 1.5;
  }
  .quiz-feedback.show { display: block; }
  .quiz-feedback.correct { border-left: 3px solid var(--green); }
  .quiz-feedback.wrong { border-left: 3px solid var(--red); }

  .quiz-result {
    max-width: 480px; margin: 0 auto; text-align: center;
  }
  .quiz-score-ring {
    width: 120px; height: 120px; margin: 0 auto 24px;
    position: relative; display: flex; align-items: center; justify-content: center;
  }
  .quiz-score-ring svg { position: absolute; top: 0; left: 0; transform: rotate(-90deg); }
  .quiz-score-num { font-size: 28px; font-weight: 700; }
  .quiz-score-label { font-size: 12px; color: var(--text3); }
  .quiz-result-msg { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .quiz-result-sub { font-size: 14px; color: var(--text2); margin-bottom: 28px; }
  .quiz-breakdown { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 24px; }
  .quiz-bd-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
  .quiz-bd-row:last-child { border-bottom: none; }
  .quiz-bd-row span:first-child { color: var(--text2); }

  /* SYLLABLE QUIZ */
  .syllable-display {
    font-size: 26px; font-weight: 700; letter-spacing: 4px;
    color: var(--text); margin: 12px 0 6px;
    font-family: 'Lora', serif;
  }
  .syllable-blank {
    display: inline-block;
    border-bottom: 3px solid var(--accent);
    color: var(--accent);
    min-width: 2ch;
    text-align: center;
    letter-spacing: 1px;
  }
  .syllable-input-row {
    display: flex; gap: 10px; align-items: center;
    justify-content: center; margin: 16px 0 8px;
  }
  .syllable-input {
    width: 160px; text-align: center;
    font-size: 18px; font-weight: 600;
    padding: 10px 14px; border-radius: var(--radius-sm);
    border: 2px solid var(--accent); background: var(--accent-bg);
    color: var(--text); font-family: 'Lora', serif;
    letter-spacing: 2px;
  }
  .syllable-input:focus { outline: none; border-color: var(--accent2); }
  .syllable-hint-badge {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 2px 9px; border-radius: 20px;
    background: var(--amber-bg); color: var(--amber);
    border: 1px solid rgba(251,191,36,0.3);
    margin-top: 4px; letter-spacing: 0.04em;
  }

  /* TOAST */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--bg4); border: 1px solid var(--border2);
    border-radius: var(--radius-sm); padding: 10px 16px;
    font-size: 13px; color: var(--text);
    transform: translateY(60px); opacity: 0;
    transition: all 0.3s; z-index: 999;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }

  /* THEME TOGGLE */
  .theme-toggle {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 20px 0;
  }
  .toggle-track {
    width: 44px; height: 24px; border-radius: 12px;

    position: relative; cursor: pointer; transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle-track.on { background: var(--accent); border-color: var(--accent); }
  .toggle-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--text3); position: absolute;
    top: 2px; left: 2px; transition: all 0.2s; pointer-events: none;
  }
  .toggle-track.on .toggle-thumb { left: 22px; background: #fff; }
  .toggle-label { font-size: 12px; color: var(--text3); user-select: none; cursor: pointer; }

  html.light .type-noun { background: rgba(22,163,100,0.1); color: #16a364; border-color: rgba(22,163,100,0.25); }
  html.light .type-verb { background: rgba(217,119,6,0.1); color: #d97706; border-color: rgba(217,119,6,0.25); }
  html.light .type-adj  { background: rgba(220,53,69,0.1); color: #dc3545; border-color: rgba(220,53,69,0.25); }
  html.light .type-adv  { background: rgba(108,95,245,0.1); color: #6c5ff5; border-color: rgba(108,95,245,0.25); }
  html.light .type-phrase { background: rgba(3,152,212,0.1); color: #0398d4; border-color: rgba(3,152,212,0.25); }
  html.light .type-other  { background: rgba(90,86,128,0.08); color: #5a5680; border-color: rgba(90,86,128,0.2); }
  html.light .vocab-card { box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  html.light .struct-card { box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  html.light .modal { box-shadow: 0 8px 40px rgba(0,0,0,0.15); }
  html.light .sidebar { box-shadow: 1px 0 0 var(--border); }

  /* PANEL */
  .panel { display: none; }
  .panel.active { display: block; }

  /* ═══════════════════════════════════════════════════
     MOBILE RESPONSIVE — Samsung S22 Ultra & all phones
     Breakpoint: ≤768px
  ═══════════════════════════════════════════════════ */
  @media (max-width: 768px) {

    /* ── Layout ── */
    .layout { flex-direction: column; padding-bottom: 68px; }

    /* ── Sidebar → Bottom Nav Bar ── */
    .sidebar {
      width: 100%;
      height: 64px;
      top: auto; bottom: 0; left: 0; right: 0;
      border-right: none;
      border-top: 1px solid var(--border);
      flex-direction: row;
      align-items: stretch;
      padding: 0;
      z-index: 1000;
    }
    .logo { display: none; }
    .sidebar-stats { display: none; }

    .nav {
      display: flex;
      flex-direction: row;
      padding: 0;
      flex: 1;
      height: 100%;
    }

    /* Button reset */
    .nav-item {
      -webkit-appearance: none; appearance: none;
      background: none; border: none; outline: none;
      font-family: inherit;
      flex: 1; height: 64px; min-width: 0;
      padding: 0; margin: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      color: var(--text2);
      border-top: 3px solid transparent;
      cursor: pointer; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
      width: auto; text-align: center;
    }
    .nav-item > * { pointer-events: none; }
    .nav-item svg { width: 22px; height: 22px; display: block; }
    /* Mobile: hide full label, show short label below icon */
    .nav-full { display: none !important; }
    .nav-short {
      display: block !important;
      font-size: 10px; font-weight: 500;
      line-height: 1; color: inherit;
    }
    .nav-item:active { background: var(--accent-bg); }
    .nav-item.active { color: var(--accent2); border-top-color: var(--accent); }
    .nav-section { display: none; }
    .nav-item:active { background: var(--accent-bg); }
    .nav-item.active {
      color: var(--accent2);
      border-top-color: var(--accent);
    }
    .nav-section { display: none; }

    /* ── Sync/Export button on mobile — shown in topbar ── */
    .sync-bar {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
    }
    .sync-bar .btn { flex: 1; justify-content: center; font-size: 12px; padding: 8px 10px; }

    /* ── Main area ── */
    .main { margin-left: 0; position: relative; z-index: 1; }

    /* ── Topbar ── */
    .topbar {
      padding: 14px 16px;
      flex-wrap: wrap;
      gap: 10px;
      position: sticky; top: 0;
    }
    .page-title { font-size: 16px; }
    .page-title span { font-size: 12px; }

    /* ── Search ── */
    .search-wrap { width: 100%; }
    .search-input { width: 100%; font-size: 16px; /* prevent iOS zoom */ }
    .topbar-actions { width: 100%; flex-direction: row; }
    .topbar-actions .search-wrap { flex: 1; }
    .topbar { flex-wrap: wrap; }

    /* ── Content ── */
    .content { padding: 16px; }

    /* ── Cards: 1 column on phone ── */
    .cards-grid { grid-template-columns: 1fr; gap: 10px; }

    /* ── Vocab card: always show actions (no hover on touch) ── */
    .card-actions { display: flex !important; }
    .vocab-card { padding: 14px; }
    .vocab-card:hover { transform: none; }
    .vc-word { font-size: 18px; padding-right: 60px; }

    /* ── Struct card ── */
    .struct-card { padding: 14px 16px; }
    .struct-card:hover { border-color: var(--border); }

    /* ── Topic filters: horizontal scroll ── */
    .topic-filters {
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .topic-filters::-webkit-scrollbar { display: none; }
    .topic-pill { white-space: nowrap; flex-shrink: 0; padding: 6px 14px; font-size: 13px; }

    .type-filter-row {
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .type-filter-row::-webkit-scrollbar { display: none; }
    .type-fpill { white-space: nowrap; flex-shrink: 0; padding: 6px 12px; font-size: 12px; }

    /* ── Topics grid: 1 col ── */
    .topics-grid { grid-template-columns: 1fr; }

    /* ── Modal: full screen on mobile ── */
    .modal-overlay { align-items: flex-end; padding: 0; }
    .modal {
      border-radius: 20px 20px 0 0;
      max-width: 100%; width: 100%;
      max-height: 92vh;
      padding: 24px 20px 32px;
    }
    .modal-title { font-size: 18px; }

    /* ── Form inputs: bigger touch targets ── */
    .form-input, .form-select, .form-textarea {
      padding: 12px 14px;
      font-size: 16px; /* prevent iOS auto-zoom */
      border-radius: var(--radius-sm);
    }
    .form-2col { grid-template-columns: 1fr; }
    .form-label { font-size: 11px; }

    /* ── Buttons: bigger ── */
    .btn { padding: 10px 16px; font-size: 14px; }
    .btn-primary { min-height: 44px; }
    .icon-btn { width: 34px; height: 34px; }
    .icon-btn svg { width: 15px; height: 15px; }

    /* ── Quiz ── */
    .quiz-option-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .quiz-option-card { padding: 12px 10px; }
    .quiz-answers { grid-template-columns: 1fr; }
    .quiz-answer { padding: 14px 16px; font-size: 14px; min-height: 52px; }
    .quiz-card { padding: 24px 16px; }
    .quiz-card-word { font-size: 22px; }
    .quiz-container { max-width: 100%; }
    .quiz-setup { max-width: 100%; }
    .quiz-result { max-width: 100%; }

    /* ── Word types grid ── */
    .wt-grid { grid-template-columns: 1fr; }

    /* ── Tenses grid ── */
    #tensesContent > div > div[style*="grid"] {
      grid-template-columns: 1fr !important;
    }

    /* ── Toast ── */
    .toast { bottom: 80px; right: 16px; left: 16px; text-align: center; }

    /* ── Scrollbar hiding on mobile ── */
    ::-webkit-scrollbar { width: 0; height: 0; }
  }

  /* Extra small: ≤380px (very narrow phones) */
  @media (max-width: 380px) {
    .nav-item svg { width: 22px; height: 22px; }
    .nav-item::after { font-size: 9px; }
    .content { padding: 12px; }
    .topbar { padding: 12px; }
  }

  /* SUPABASE STATUS BAR */
  .sb-status-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 20px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--text3);
    min-height: 28px;
  }
  .sb-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); flex-shrink: 0; }
  .sb-dot.online { background: var(--green); box-shadow: 0 0 0 3px rgba(62,207,142,0.2); }
  .sb-dot.syncing { background: var(--amber); animation: pulse-dot 1s infinite; }
  .sb-dot.error { background: var(--red); }
  @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.4} }
  @keyframes spin { to{transform:rotate(360deg)} }
  .sb-spinner { width:12px;height:12px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block;vertical-align:middle; }

</style>
</head>

function setSbStatus(state, text) {

async function sbFetch(path, opts = {}) {

    ...opts,

async function sbPushData() {
  const defStructIds = getDefaultStructs().map(s => s.id);
  const defTopicIds = DEFAULT_TOPICS.map(t => t.id);
  const payload = {
    vocab: data.vocab,
    structs: data.structs.filter(s => !defStructIds.includes(s.id)),
    topics: data.topics.filter(t => !defTopicIds.includes(t.id)),
    updated_at: new Date().toISOString()
  };
  try {
    const res = await sbFetch('/rest/v1/englishvault?id=eq.shared', { method: 'PATCH', body: JSON.stringify(payload) });
    const json = await res.json();
    if (!json || json.length === 0) {
      await sbFetch('/rest/v1/englishvault', { method: 'POST', body: JSON.stringify({ id: 'shared', ...payload }) });
    }
  } catch(e) {
    setSbStatus('error', '⚠ Sync error — check connection');
    console.error('sbPush error:', e);
  }
}

function sbDebouncedSave() {
  setSbStatus('syncing', '<span class="sb-spinner"></span> Saving...');
  clearTimeout(sbSaveTimeout);
  sbSaveTimeout = setTimeout(async () => {
    await sbPushData();
    setSbStatus('online', '🟢 Live — synced');
  }, 800);
}

function mergeRemoteData(remote) {
  const defStructIds = getDefaultStructs().map(s => s.id);
  const defTopicIds = DEFAULT_TOPICS.map(t => t.id);
  const defVocabIds = DEFAULT_VOCAB.map(v => v.id);
  if (Array.isArray(remote.vocab)) {
    remote.vocab.forEach(rv => {
      rv = migrateVocab(rv);
      const idx = data.vocab.findIndex(v => v.id === rv.id);
      if (idx === -1) data.vocab.unshift(rv); else data.vocab[idx] = rv;
    });
    const remoteIds = remote.vocab.map(v => v.id);
    data.vocab = data.vocab.filter(v => defVocabIds.includes(v.id) || remoteIds.includes(v.id));
  }
  if (Array.isArray(remote.structs)) {
    remote.structs.forEach(rs => {
      if (!defStructIds.includes(rs.id)) {
        const idx = data.structs.findIndex(s => s.id === rs.id);
        if (idx === -1) data.structs.push(rs); else data.structs[idx] = rs;
      }
    });
    const remoteStructIds = remote.structs.map(s => s.id);
    data.structs = data.structs.filter(s => defStructIds.includes(s.id) || remoteStructIds.includes(s.id));
  }
  if (Array.isArray(remote.topics)) {
    remote.topics.forEach(rt => {
      if (!defTopicIds.includes(rt.id)) {
        const idx = data.topics.findIndex(t => t.id === rt.id);
        if (idx === -1) data.topics.push(rt); else data.topics[idx] = rt;
      }
    });
    const remoteTopicIds = remote.topics.map(t => t.id);
    data.topics = data.topics.filter(t => defTopicIds.includes(t.id) || remoteTopicIds.includes(t.id));
  }
  try { localStorage.setItem('englishvault_data', JSON.stringify({ vocab: data.vocab, structs: data.structs, topics: data.topics })); } catch(e) {}
  renderAll();
}

async function initSupabase() {
  setSbStatus('syncing', '<span class="sb-spinner"></span> Connecting...');
  try {
    const res = await sbFetch('/rest/v1/englishvault?id=eq.shared&select=vocab,structs,topics,updated_at');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    if (rows && rows.length > 0) mergeRemoteData(rows[0]);
    else await sbPushData();
    setSbStatus('online', '🟢 Live — synced');
    // Poll every 5s for changes from other users
    let lastUpdated = null;
    setInterval(async () => {
      try {
        const r = await sbFetch('/rest/v1/englishvault?id=eq.shared&select=vocab,structs,topics,updated_at');
        if (!r.ok) return;
        const rows = await r.json();
        if (!rows || !rows.length) return;
        if (rows[0].updated_at !== lastUpdated) {
          lastUpdated = rows[0].updated_at;
          mergeRemoteData(rows[0]);
        }
      } catch(e) {}
    }, 5000);
  } catch(e) {
    setSbStatus('error', '⚠ Connection failed: ' + e.message);
    console.error('Supabase init error:', e);
  }
}

// Migrate old-format vocab (type/meaning/example) → new format (types[]/meanings{}/example)
function migrateVocab(v) {
  if (Array.isArray(v.types)) return v; // already new format
  const t = v.type || 'other';
  return {
    id: v.id, word: v.word, phonetic: v.phonetic || '', topic: v.topic || '',
    types: [t],
    meanings: { [t]: v.meaning || '' },
    example: v.example || ''
  };
}

function loadData() {
  try {
    const s = localStorage.getItem('englishvault_data');
    if (s) data = JSON.parse(s);
  } catch(e) {}

  // Always ensure all default topics exist (merge, don't overwrite)
  if (!data.topics) data.topics = [];
  DEFAULT_TOPICS.forEach(dt => {
    if (!data.topics.find(t => t.id === dt.id)) data.topics.push(dt);
    else {
      // Update name/color in case it changed
      const existing = data.topics.find(t => t.id === dt.id);
      existing.name = dt.name;
      existing.color = dt.color;
    }
  });

  // Always ensure all default structs exist (merge by id)
  if (!data.structs) data.structs = [];
  getDefaultStructs().forEach(ds => {
    if (!data.structs.find(s => s.id === ds.id)) data.structs.push(ds);
  });

  // Always ensure all default vocab exist (merge by id)
  if (!data.vocab) data.vocab = [];
  data.vocab = data.vocab.map(migrateVocab);
  DEFAULT_VOCAB.forEach(dv => {
    if (!data.vocab.find(v => v.id === dv.id)) data.vocab.push(dv);
  });

  try { localStorage.setItem('englishvault_data', JSON.stringify({ vocab: data.vocab, structs: data.structs, topics: data.topics })); } catch(e) {}
}

// ─── HELPERS ─────────────────────────────────────────
function uid() { return '_' + Math.random().toString(36).slice(2, 9); }

function getTopic(id) { return data.topics.find(t => t.id === id); }
function getTopicName(id) { const t = getTopic(id); return t ? t.name : ''; }
function getTopicColor(id) { const t = getTopic(id); return t ? t.color : '#5e5c74'; }

function typeInfo(val) { return WORD_TYPES.find(t => t.val === val) || WORD_TYPES[5]; }

// Get primary display meaning (join all meanings across types)
function getCombinedMeaning(v) {
  if (v.meanings && typeof v.meanings === 'object') {
    return Object.values(v.meanings).filter(Boolean).join(' / ');
  }
  return v.meaning || '';
}

// Get meaning for a specific type
function getMeaningForType(v, typeVal) {
  if (v.meanings && v.meanings[typeVal]) return v.meanings[typeVal];
  return getCombinedMeaning(v);
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ─── SYLLABLE HELPERS ─────────────────────────────────
function countSyllables(word) {
  // Count syllables for a single alpha word
  const clean = word.toLowerCase().replace(/[^a-z]/g, '');
  if (!clean) return 0;
  let count = 0;
  let prevVowel = false;
  for (let i = 0; i < clean.length; i++) {
    const isVowel = /[aeiouy]/.test(clean[i]);
    if (isVowel && !prevVowel) count++;
    prevVowel = isVowel;
  }
  // Remove silent trailing 'e' (e.g. "fire" = 1, "side" = 1)
  if (count > 1 && /[^aeiou]e$/.test(clean)) count--;
  return Math.max(1, count);
}

function countSyllablesPhrase(phrase) {
  return phrase.split(/\s+/).reduce((sum, w) => sum + countSyllables(w), 0);
}

function generateSyllableMask(phrase) {
  // Strategy: split phrase into tokens (words + separators like "/").
  // Only mask alpha-only tokens. Pick the token with most syllables.
  // Hide a suffix chunk of that token, keeping a visible prefix for context.
  // Answer = the hidden suffix (lowercase, alpha only).

  // Tokenise: split on spaces, then within each space-token split on "/" to get real words
  const spaceTokens = phrase.split(' ');

  // Flatten to [{ text, isWord, spaceIdx }] preserving order
  // We'll work on "words" = alpha-only segments ignoring punctuation tokens
  const alphaWords = []; // { word: cleanAlpha, original: raw, globalIdx }
  spaceTokens.forEach((tok, si) => {
    const parts = tok.split('/');
    parts.forEach(part => {
      const clean = part.replace(/[^a-zA-Z]/g, '');
      if (clean.length > 0) alphaWords.push({ word: clean, original: part });
    });
  });

  const totalSyllables = alphaWords.reduce((s, t) => s + countSyllables(t.word), 0);
  if (totalSyllables <= 1) return null;

  // Find the alpha word with the most syllables
  let bestIdx = 0, bestSyl = 0;
  alphaWords.forEach((t, i) => {
    const s = countSyllables(t.word);
    if (s > bestSyl) { bestSyl = s; bestIdx = i; }
  });

  // If the best word only has 1 syllable, there's nothing meaningful to mask
  if (bestSyl <= 1) return null;

  const targetWord = alphaWords[bestIdx].word; // clean alpha
  const targetSyl = countSyllables(targetWord);

  // How many syllables to hide: 1 for 2-3 total syl, 2 for 4+
  const sylToHide = totalSyllables >= 4 ? 2 : 1;

  // Split targetWord into syllable segments using a simple vowel-group approach
  // Build segments: each segment = consonants* + vowels + consonants*
  const segs = [];
  let i = 0;
  const w = targetWord.toLowerCase();
  while (i < w.length) {
    let seg = '';
    // leading consonants
    while (i < w.length && !/[aeiouy]/.test(w[i])) { seg += w[i]; i++; }
    // vowel nucleus
    while (i < w.length && /[aeiouy]/.test(w[i])) { seg += w[i]; i++; }
    // coda consonants — only grab them if the NEXT char is NOT a vowel start
    while (i < w.length && !/[aeiouy]/.test(w[i]) && (i + 1 >= w.length || !/[aeiouy]/.test(w[i + 1]))) {
      seg += w[i]; i++;
    }
    if (seg) segs.push(seg);
  }
  if (!segs.length) segs.push(w);

  // Hide the LAST `sylToHide` segments (suffix) → gives a visible prefix as hint
  const hideFromIdx = Math.max(1, segs.length - sylToHide); // always keep at least seg[0] visible
  const visiblePart = segs.slice(0, hideFromIdx).join('');
  const hiddenPart  = segs.slice(hideFromIdx).join('');

  // If nothing to hide (edge case), hide last half of word
  const finalVisible = visiblePart || w.slice(0, Math.max(1, Math.floor(w.length / 2)));
  const finalHidden  = hiddenPart  || w.slice(Math.max(1, Math.floor(w.length / 2)));

  const blanks = '_'.repeat(finalHidden.length);

  // Rebuild maskedPhrase: replace only the first occurrence of the target token
  // Work at the original phrase level, replacing just the clean word inside it
  const targetOriginal = alphaWords[bestIdx].original;
  // Replace the alpha part inside targetOriginal with visible+blanks
  const maskedToken = targetOriginal.replace(
    new RegExp(targetWord, 'i'),
    finalVisible + blanks
  );
  // Replace first occurrence of targetOriginal in phrase
  const maskedPhrase = phrase.replace(targetOriginal, maskedToken);

  return {
    maskedPhrase,
    hidden: finalHidden.toLowerCase(),
    totalSyllables,
    hideCount: sylToHide
  };
}

function startQuiz() {
  const topicSel = document.getElementById('quiz-topic-select').value;
  const mode = quizState.mode;

  let pool = [];
  if (mode === 'struct') {
    pool = topicSel === 'all' ? [...data.structs] : data.structs.filter(s => s.topic === topicSel);
    if (pool.length < 2) { alert('You need at least 2 structures to start a quiz!'); return; }
  } else if (mode === 'syllable') {
    // Only include vocab where at least ONE word in the phrase has 2+ syllables
    const raw = topicSel === 'all' ? [...data.vocab] : data.vocab.filter(v => v.topic === topicSel);
    pool = raw.filter(v => {
      const words = v.word.split(/[\s/]+/).map(w => w.replace(/[^a-zA-Z]/g,''));
      return words.some(w => w.length > 0 && countSyllables(w) >= 2);
    });
    if (pool.length < 1) { alert('No eligible words found (need at least 1 word with ≥ 2 syllables). Please add more words!'); return; }
  } else {
    pool = topicSel === 'all' ? [...data.vocab] : data.vocab.filter(v => v.topic === topicSel);
    if (pool.length < 2) { alert('You need at least 2 vocabulary words to start a quiz!'); return; }
  }

  const questions = shuffle(pool).slice(0, Math.min(10, pool.length)).map(item => {
    if (mode === 'syllable') {
      const mask = generateSyllableMask(item.word);
      if (!mask) return null; // safety — shouldn't happen since pool is filtered
      return {
        item, type: 'syllable',
        maskedPhrase: mask.maskedPhrase,
        hidden: mask.hidden,
        fullPhrase: item.word,
        totalSyllables: mask.totalSyllables,
        hideCount: mask.hideCount
      };
    }
    if (mode === 'fill') {
      return { item, type: 'fill', answer: item.word };
    }
    // Build distractors
    const others = pool.filter(p => p.id !== item.id);
    const distractors = shuffle(others).slice(0, 3);
    let choices, correctLabel, questionLabel;

    if (mode === 'vocab-meaning') {
      correctLabel = getCombinedMeaning(item);
      questionLabel = item.word;
      choices = shuffle([item, ...distractors]).map(c => ({ id: c.id, label: getCombinedMeaning(c), correct: c.id === item.id }));
    } else if (mode === 'meaning-vocab') {
      correctLabel = item.word;
      questionLabel = getCombinedMeaning(item);
      choices = shuffle([item, ...distractors]).map(c => ({ id: c.id, label: c.word, correct: c.id === item.id }));
    } else {
      correctLabel = item.name;
      questionLabel = item.pattern || item.name;
      choices = shuffle([item, ...distractors]).map(c => ({ id: c.id, label: c.name, correct: c.id === item.id }));
    }
    return { item, type: 'choice', choices, questionLabel, correctLabel };
  }).filter(Boolean);

  quizState = { mode, topic: topicSel, questions, current: 0, score: 0, answered: false, wrongItems: [] };
  renderQuizQuestion();
}

function renderQuizQuestion() {

      <div class="quiz-container">
        <div class="quiz-meta">

            </button>

          <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px">Vietnamese Meaning</div>
          <input class="form-input" type="text" id="meaningInput"
            placeholder="Enter Vietnamese meaning..."
            autocomplete="off" autocorrect="off" spellcheck="false"
            onkeydown="if(event.key==='Enter')checkSyllable()">
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <button class="btn btn-ghost" onclick="skipQuestion()">Skip →</button>
          <button class="btn btn-primary" onclick="checkSyllable()">Check</button>
        </div>
        <div class="quiz-feedback" id="quizFeedback"></div>

  } else if (q.type === 'fill') {
    document.getElementById('quizContent').innerHTML = `
      <div class="quiz-container">
        <div class="quiz-meta">
          <span>Question ${current + 1} / ${questions.length}</span>
          <span style="color:var(--green)">✓ ${quizState.score} correct</span>
        </div>
        <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${progress}%"></div></div>
        <div class="quiz-card">
          <div class="quiz-card-label">Fill in the English Word</div>
          <div class="quiz-card-word" style="font-size:18px;color:var(--text2)">${q.item.meaning}</div>

function checkAnswer(idx) {
  if (quizState.answered) return;
  quizState.answered = true;
  const q = quizState.questions[quizState.current];
  const chosen = q.choices[idx];
  const fb = document.getElementById('quizFeedback');
  document.querySelectorAll('.quiz-answer').forEach(a => a.classList.add('disabled'));

  if (chosen.correct) {
    quizState.score++;
    document.getElementById('ans-' + idx).classList.add('correct');
    fb.textContent = '✓ Correct!';
    fb.className = 'quiz-feedback show correct';
  } else {
    document.getElementById('ans-' + idx).classList.add('wrong');
    quizState.wrongItems.push(q.item);
    const correctIdx = q.choices.findIndex(c => c.correct);
    document.getElementById('ans-' + correctIdx).classList.add('correct');
    fb.innerHTML = `✗ Wrong! Correct answer: <strong>${q.choices[correctIdx].label}</strong>`;
    fb.className = 'quiz-feedback show wrong';
  }
  document.getElementById('quizNextBtn').innerHTML = `<button class="btn btn-primary" onclick="nextQuestion()">Next →</button>`;
}

function checkFill() {
  if (quizState.answered) return;
  const input = document.getElementById('fillInput');
  if (!input) return;
  const val = input.value.trim().toLowerCase();
  const q = quizState.questions[quizState.current];
  const correct = q.answer.toLowerCase();
  quizState.answered = true;
  input.disabled = true;
  const fb = document.getElementById('quizFeedback');
  if (val === correct) {
    quizState.score++;
    input.style.borderColor = 'var(--green)';
    fb.textContent = '✓ Correct!';
    fb.className = 'quiz-feedback show correct';
  } else {
    input.style.borderColor = 'var(--red)';
    quizState.wrongItems.push(q.item);
    fb.innerHTML = `✗ Wrong! The correct word is: <strong>${q.answer}</strong>`;
    fb.className = 'quiz-feedback show wrong';
  }
  const wrap = fb.parentElement;
  const btn = wrap.querySelector('.btn-ghost');
  if (btn) btn.remove();
  const nb = document.createElement('div');
  nb.style.textAlign = 'right';
  nb.innerHTML = `<button class="btn btn-primary" onclick="nextQuestion()">Next →</button>`;
  wrap.appendChild(nb);
}

function checkSyllable() {
  if (quizState.answered) return;
  const input = document.getElementById('syllableInput');
  const meaningInputEl = document.getElementById('meaningInput');
  if (!input) return;
  const val = input.value.trim().toLowerCase();
  const meaningVal = meaningInputEl ? meaningInputEl.value.trim().toLowerCase() : '';
  const q = quizState.questions[quizState.current];
  const correct = q.hidden.toLowerCase();
  const correctMeaning = getCombinedMeaning(q.item).trim().toLowerCase();
  quizState.answered = true;
  input.disabled = true;
  if (meaningInputEl) meaningInputEl.disabled = true;
  const fb = document.getElementById('quizFeedback');

  const syllableOk = val === correct;
  // Meaning check: accept if the user's answer is contained in the correct meaning or vice versa (flexible match)
  const meaningOk = correctMeaning && meaningVal && (correctMeaning.includes(meaningVal) || meaningVal.includes(correctMeaning) || meaningVal === correctMeaning);

  if (syllableOk && meaningOk) {
    quizState.score++;
    input.style.borderColor = 'var(--green)';
    if (meaningInputEl) meaningInputEl.style.borderColor = 'var(--green)';
    fb.innerHTML = `✓ Correct! Full word: <strong>${q.fullPhrase}</strong>`;
    fb.className = 'quiz-feedback show correct';
  } else if (syllableOk && !meaningOk) {
    quizState.score += 0.5;
    input.style.borderColor = 'var(--green)';
    if (meaningInputEl) meaningInputEl.style.borderColor = 'var(--amber)';
    quizState.wrongItems.push(q.item);
    fb.innerHTML = `✓ Syllable correct! But the Vietnamese meaning was: <strong>${getCombinedMeaning(q.item)}</strong>`;
    fb.className = 'quiz-feedback show wrong';
  } else {
    input.style.borderColor = 'var(--red)';
    if (meaningInputEl) meaningInputEl.style.borderColor = syllableOk ? 'var(--amber)' : 'var(--red)';
    quizState.wrongItems.push(q.item);
    fb.innerHTML = `✗ Incorrect! Missing syllable: <strong>${q.hidden}</strong> → Full word: <strong>${q.fullPhrase}</strong><br><span style="font-size:12px">Vietnamese meaning: <strong>${getCombinedMeaning(q.item)}</strong></span>`;
    fb.className = 'quiz-feedback show wrong';
  }
  // Remove skip button, add next button
  const wrap = fb.parentElement;
  const nb = document.createElement('div');
  nb.style.textAlign = 'right';
  nb.style.marginTop = '8px';
  nb.innerHTML = `<button class="btn btn-primary" onclick="nextQuestion()">Next →</button>`;
  wrap.appendChild(nb);
}

let _meaningVisible = false;

  _meaningVisible = !_meaningVisible;

  }
}

function retryQuiz() {
  // Reuse the same mode and topic from the previous round
  const savedMode = quizState.mode;
  const savedTopic = quizState.topic;

  let pool = [];
  if (savedMode === 'struct') {
    pool = savedTopic === 'all' ? [...data.structs] : data.structs.filter(s => s.topic === savedTopic);
    if (pool.length < 2) { alert('You need at least 2 structures!'); return; }
  } else if (savedMode === 'syllable') {
    const raw = savedTopic === 'all' ? [...data.vocab] : data.vocab.filter(v => v.topic === savedTopic);
    pool = raw.filter(v => {
      const words = v.word.split(/[\s/]+/).map(w => w.replace(/[^a-zA-Z]/g,''));
      return words.some(w => w.length > 0 && countSyllables(w) >= 2);
    });
    if (pool.length < 1) { alert('Not enough words to practice!'); return; }
  } else {
    pool = savedTopic === 'all' ? [...data.vocab] : data.vocab.filter(v => v.topic === savedTopic);
    if (pool.length < 2) { alert('You need at least 2 vocabulary words!'); return; }
  }

  const questions = shuffle(pool).slice(0, Math.min(10, pool.length)).map(item => {
    if (savedMode === 'syllable') {
      const mask = generateSyllableMask(item.word);
      if (!mask) return null;
      return { item, type: 'syllable', maskedPhrase: mask.maskedPhrase, hidden: mask.hidden, fullPhrase: item.word, totalSyllables: mask.totalSyllables, hideCount: mask.hideCount };
    }
    if (savedMode === 'fill') return { item, type: 'fill', answer: item.word };
    const others = pool.filter(p => p.id !== item.id);
    const distractors = shuffle(others).slice(0, 3);
    let choices, correctLabel, questionLabel;
    if (savedMode === 'vocab-meaning') {
      correctLabel = getCombinedMeaning(item); questionLabel = item.word;
      choices = shuffle([item, ...distractors]).map(c => ({ id: c.id, label: getCombinedMeaning(c), correct: c.id === item.id }));
    } else if (savedMode === 'meaning-vocab') {
      correctLabel = item.word; questionLabel = getCombinedMeaning(item);
      choices = shuffle([item, ...distractors]).map(c => ({ id: c.id, label: c.word, correct: c.id === item.id }));
    } else {
      correctLabel = item.name; questionLabel = item.pattern || item.name;
      choices = shuffle([item, ...distractors]).map(c => ({ id: c.id, label: c.name, correct: c.id === item.id }));
    }
    return { item, type: 'choice', choices, questionLabel, correctLabel };
  }).filter(Boolean);

  quizState = { mode: savedMode, topic: savedTopic, questions, current: 0, score: 0, answered: false, wrongItems: [] };
  renderQuizQuestion();
}

function skipQuestion() {
  quizState.wrongItems.push(quizState.questions[quizState.current].item);
  nextQuestion();
}

function nextQuestion() {
  quizState.current++;
  quizState.answered = false;
  if (quizState.current >= quizState.questions.length) {
    renderQuizResult();
  } else {
    renderQuizQuestion();
  }
}

function renderQuizResult() {
  const { score, questions, wrongItems } = quizState;
  const pct = Math.round((score / questions.length) * 100);
  const r = 54;
  const circ = 2 * Math.PI * r;
  const dash = (pct / 100) * circ;
  const msg = pct >= 90 ? '🎉 Excellent!' : pct >= 70 ? '👍 Well done!' : pct >= 50 ? '💪 Keep going!' : '📚 More practice needed!';
  const sub = pct >= 90 ? 'You have an excellent memory!' : pct >= 70 ? 'Good result, keep it up!' : 'Review the ones you got wrong!';

  const wrongHtml = wrongItems.length ? `
    <div class="quiz-breakdown" style="text-align:left;margin-bottom:16px">
      <div style="font-size:13px;font-weight:600;margin-bottom:10px;color:var(--text2)">Review these (${wrongItems.length}):</div>
      ${wrongItems.map(w => `
        <div class="quiz-bd-row">
          <span>${'word' in w ? w.word : w.name}</span>
          <span style="color:var(--text3)">${'meanings' in w || 'meaning' in w ? getCombinedMeaning(w) : (w.pattern || '')}</span>
        </div>`).join('')}
    </div>` : '';

  document.getElementById('quizContent').innerHTML = `
    <div class="quiz-result">
      <div class="quiz-score-ring">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--bg3)" stroke-width="8"/>
          <circle cx="60" cy="60" r="${r}" fill="none" stroke="${pct >= 70 ? 'var(--green)' : pct >= 50 ? 'var(--amber)' : 'var(--red)'}"
            stroke-width="8" stroke-linecap="round"
            stroke-dasharray="${dash} ${circ}" stroke-dashoffset="0"/>
        </svg>
        <div>
          <div class="quiz-score-num">${pct}%</div>
          <div class="quiz-score-label">${score}/${questions.length}</div>
        </div>
      </div>
      <div class="quiz-result-msg">${msg}</div>
      <div class="quiz-result-sub">${sub}</div>
      ${wrongHtml}
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="btn btn-ghost" onclick="renderQuizSetup()">← Back to Menu</button>
        <button class="btn btn-primary" onclick="retryQuiz()">Try Again</button>
      </div>
    </div>`;
}

  const cardsHtml = WORD_TYPES.map(t => {
    const count = data.vocab.filter(v => Array.isArray(v.types) ? v.types.includes(t.val) : v.type === t.val).length;
    const myWords = data.vocab.filter(v => Array.isArray(v.types) ? v.types.includes(t.val) : v.type === t.val).slice(0, 6);
    const tipsHtml = t.tips.map(tip =>
      `<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:5px">
        <span style="color:${t.color};font-size:12px;margin-top:2px;flex-shrink:0">▸</span>
        <span style="font-size:12px;color:var(--text2)">${tip}</span>
      </div>`
    ).join('');
    const exHtml = t.examples.map(ex =>
      `<span class="wt-ex-word ${t.cls}" style="font-size:11px;padding:2px 8px;border-radius:20px">${ex}</span>`
    ).join('');
    return `
    <div class="wt-card" style="background:${t.bg};border-color:${t.border}">
      <div class="wt-card-head">
        <div class="wt-icon" style="background:${t.color}22;font-size:20px">${t.icon}</div>
        <div>
          <div class="wt-card-name" style="color:${t.color}">${t.label}</div>
          <div class="wt-card-en" style="color:${t.color}">${t.en}</div>
        </div>
        <div style="margin-left:auto;text-align:right">
          <div style="font-size:22px;font-weight:700;color:${t.color}">${count}</div>
          <div style="font-size:10px;color:${t.color};opacity:0.7">your words</div>
        </div>
      </div>
      <div class="wt-desc">${t.desc}</div>
      <div style="margin-bottom:10px">${tipsHtml}</div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em;font-weight:600">Examples</div>
      <div class="wt-examples">${exHtml}</div>
      ${myWords.length ? `
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid ${t.border}">
          <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;margin-bottom:8px">Your Words</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${myWords.map(w => `<span style="font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;background:${t.color}15;color:${t.color};cursor:pointer" onclick="showPanel('vocab');setVocabType('${t.val}')">${w.word}</span>`).join('')}
            ${count > 6 ? `<span style="font-size:12px;color:var(--text3);padding:3px 6px">+${count-6} more...</span>` : ''}
          </div>
        </div>` : `
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid ${t.border};font-size:12px;color:var(--text3)">
          No words yet. <span style="color:${t.color};cursor:pointer;font-weight:500" onclick="openModal('vocab')">Add a word →</span>
        </div>`}
    </div>`;
  }).join('');

  el.innerHTML = `
    <div style="margin-bottom:24px">
      <h2 style="font-size:15px;font-weight:600;margin-bottom:4px">Word Type Overview</h2>
      <p style="font-size:13px;color:var(--text2)">Understanding word types helps you use words accurately and build grammatically correct sentences.</p>
    </div>
    <div class="wt-grid">${cardsHtml}</div>`;
}

// ─── MODAL ───────────────────────────────────────────
function openModal(mode, id) {
  modalMode = mode; editingId = id || null;
  document.getElementById('modalOverlay').classList.add('open');
  const titles = { vocab: id ? 'Edit Vocabulary' : 'Add Vocabulary', struct: id ? 'Edit Sentence Structure' : 'Add Sentence Structure', topic: id ? 'Edit Topic' : 'Add Topic' };
  document.getElementById('modalTitle').textContent = titles[mode];
  const topicOpts = data.topics.map(t => `<option value="${t.id}">${t.name}</option>`).join('');

  if (mode === 'vocab') {
    const v = id ? data.vocab.find(x => x.id === id) : {};
    const vTypes = Array.isArray(v && v.types) ? v.types : (v && v.type ? [v.type] : []);
    const vMeanings = (v && v.meanings) ? v.meanings : (v && v.meaning ? { [v.type || 'other']: v.meaning } : {});
    const typeCheckboxes = WORD_TYPES.map(t => `
      <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:4px 10px;border-radius:20px;border:1px solid ${vTypes.includes(t.val) ? t.border : 'var(--border)'};background:${vTypes.includes(t.val) ? t.bg : 'transparent'};transition:all 0.15s" id="typelabel-${t.val}">
        <input type="checkbox" value="${t.val}" ${vTypes.includes(t.val) ? 'checked' : ''} style="display:none" onchange="onTypeCheckboxChange()">
        <span style="font-size:10px;font-weight:700;color:${t.color}">${t.icon} ${t.label}</span>
      </label>`).join('');
    const meaningsHtml = WORD_TYPES.filter(t => vTypes.includes(t.val)).map(t =>
      `<div class="form-row meaning-row" id="meaning-row-${t.val}">
        <label class="form-label" style="color:${t.color}">${t.icon} ${t.label} — Nghĩa tiếng Việt *</label>
        <textarea class="form-textarea" id="f-meaning-${t.val}" placeholder="Nhập nghĩa (${t.label})...">${vMeanings[t.val] || ''}</textarea>
      </div>`).join('');
    document.getElementById('modalBody').innerHTML = `
      <div class="form-row"><label class="form-label">Word *</label><input class="form-input" type="text" id="f-word" value="${(v && v.word) || ''}" placeholder="Enter English word..."></div>
      <div class="form-row"><label class="form-label">Phonetic</label><input class="form-input" type="text" id="f-phonetic" value="${(v && v.phonetic) || ''}" placeholder="e.g. həˈloʊ"></div>
      <div class="form-row"><label class="form-label">Topic</label><select class="form-select" id="f-topic"><option value="">None</option>${topicOpts}</select></div>
      <div class="form-row">
        <label class="form-label">Word Type (chọn một hoặc nhiều)</label>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px" id="typeCheckboxGroup">${typeCheckboxes}</div>
      </div>
      <div id="meaningsContainer">${meaningsHtml}</div>
      <div class="form-row"><label class="form-label">Example Sentence (dùng chung)</label><textarea class="form-textarea" id="f-example" placeholder="Ví dụ câu...">${(v && v.example) || ''}</textarea></div>`;
    if (v && v.topic) setTimeout(() => { const s = document.getElementById('f-topic'); if (s) s.value = v.topic; }, 10);
  } else if (mode === 'struct') {
    const s = id ? data.structs.find(x => x.id === id) : {};
    document.getElementById('modalBody').innerHTML = `
      <div class="form-row"><label class="form-label">Structure Name *</label><input class="form-input" type="text" id="f-name" value="${(s && s.name) || ''}" placeholder="e.g. Present Perfect"></div>
      <div class="form-row"><label class="form-label">Pattern</label><input class="form-input" type="text" id="f-pattern" value="${(s && s.pattern) || ''}" placeholder="e.g. S + have/has + V3"></div>
      <div class="form-2col">
        <div class="form-row"><label class="form-label">Role</label><input class="form-input" type="text" id="f-role" value="${(s && s.role) || ''}" placeholder="e.g. Giving advice, Requesting..."></div>
        <div class="form-row"><label class="form-label">Topic</label><select class="form-select" id="f-stopic"><option value="">None</option>${topicOpts}</select></div>
      </div>
      <div class="form-row"><label class="form-label">Usage / Meaning</label><textarea class="form-textarea" id="f-meaning" placeholder="Explain usage...">${(s && s.meaning) || ''}</textarea></div>
      <div class="form-row"><label class="form-label">Example Sentence</label><textarea class="form-textarea" id="f-example" placeholder="e.g. I have lived here for 5 years.">${(s && s.example) || ''}</textarea></div>`;
    if (s && s.topic) setTimeout(() => { const el = document.getElementById('f-stopic'); if (el) el.value = s.topic; }, 10);
  } else {
    const t = id ? data.topics.find(x => x.id === id) : {};
    const selectedColor = (t && t.color) || TOPIC_COLORS[0];
    document.getElementById('modalBody').innerHTML = `
      <div class="form-row"><label class="form-label">Topic Name *</label><input class="form-input" type="text" id="f-tname" value="${(t && t.name) || ''}" placeholder="e.g. Travel, Work..."></div>
      <div class="form-row"><label class="form-label">Color</label>
        <div class="color-picker" id="colorPicker">
          ${TOPIC_COLORS.map(c => `<div class="color-swatch ${c === selectedColor ? 'selected' : ''}" style="background:${c}" data-color="${c}" onclick="selectColor('${c}')"></div>`).join('')}
        </div>
        <input type="hidden" id="f-color" value="${selectedColor}">
      </div>`;
  }
}

function onTypeCheckboxChange() {
  const container = document.getElementById('meaningsContainer');
  if (!container) return;
  // Collect current meaning values before re-render
  const currentMeanings = {};
  WORD_TYPES.forEach(t => {
    const el = document.getElementById('f-meaning-' + t.val);
    if (el) currentMeanings[t.val] = el.value;
  });
  // Get checked types
  const checked = [...document.querySelectorAll('#typeCheckboxGroup input[type=checkbox]:checked')].map(cb => cb.value);
  // Update label styles
  WORD_TYPES.forEach(t => {
    const lbl = document.getElementById('typelabel-' + t.val);
    if (!lbl) return;
    const isChecked = checked.includes(t.val);
    lbl.style.borderColor = isChecked ? t.border : 'var(--border)';
    lbl.style.background = isChecked ? t.bg : 'transparent';
  });
  // Re-render meaning rows
  container.innerHTML = WORD_TYPES.filter(t => checked.includes(t.val)).map(t =>
    `<div class="form-row meaning-row" id="meaning-row-${t.val}">
      <label class="form-label" style="color:${t.color}">${t.icon} ${t.label} — Nghĩa tiếng Việt *</label>
      <textarea class="form-textarea" id="f-meaning-${t.val}" placeholder="Nhập nghĩa (${t.label})...">${currentMeanings[t.val] || ''}</textarea>
    </div>`).join('');
}

function selectColor(c) {
  document.getElementById('f-color').value = c;
  document.querySelectorAll('.color-swatch').forEach(d => d.classList.toggle('selected', d.dataset.color === c));
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingId = null; modalMode = null;
}

function saveItem() {
  if (modalMode === 'vocab') {
    const word = document.getElementById('f-word').value.trim();
    if (!word) { alert('Please enter the word!'); return; }
    const types = [...document.querySelectorAll('#typeCheckboxGroup input[type=checkbox]:checked')].map(cb => cb.value);
    if (!types.length) { alert('Please select at least one word type!'); return; }
    const meanings = {};
    let hasMeaning = false;
    types.forEach(tval => {
      const el = document.getElementById('f-meaning-' + tval);
      if (el) { meanings[tval] = el.value.trim(); if (meanings[tval]) hasMeaning = true; }
    });
    if (!hasMeaning) { alert('Please enter at least one meaning!'); return; }
    const item = {
      id: editingId || uid(), word,
      phonetic: document.getElementById('f-phonetic').value.trim(),
      types,
      meanings,
      topic: document.getElementById('f-topic').value,
      example: document.getElementById('f-example').value.trim()
    };
    if (editingId) { const i = data.vocab.findIndex(x => x.id === editingId); data.vocab[i] = item; }
    else data.vocab.unshift(item);
    toast('✓ Vocabulary saved');
  } else if (modalMode === 'struct') {
    const name = document.getElementById('f-name').value.trim();
    if (!name) { alert('Please enter the structure name!'); return; }
    const item = { id: editingId || uid(), name, pattern: document.getElementById('f-pattern').value.trim(), role: document.getElementById('f-role').value.trim(), topic: document.getElementById('f-stopic').value, meaning: document.getElementById('f-meaning').value.trim(), example: document.getElementById('f-example').value.trim() };
    if (editingId) { const i = data.structs.findIndex(x => x.id === editingId); data.structs[i] = item; }
    else data.structs.unshift(item);
    toast('✓ Structure saved');
  } else {
    const name = document.getElementById('f-tname').value.trim();
    if (!name) { alert('Please enter the topic name!'); return; }
    const item = { id: editingId || uid(), name, color: document.getElementById('f-color').value };
    if (editingId) { const i = data.topics.findIndex(x => x.id === editingId); data.topics[i] = item; }
    else data.topics.push(item);
    toast('✓ Topic saved');
  }
  saveData();
  closeModal();
  renderAll();
}

function deleteItem(type, id) {
  const labels = { vocab: 'vocabulary item', struct: 'structure', topic: 'topic' };
  if (!confirm(`Delete this ${labels[type]}?`)) return;
  if (type === 'vocab') data.vocab = data.vocab.filter(x => x.id !== id);
  else if (type === 'struct') data.structs = data.structs.filter(x => x.id !== id);
  else data.topics = data.topics.filter(x => x.id !== id);
  saveData();
  renderAll();
  toast('Deleted');
}

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ─── EXPORT / IMPORT ─────────────────────────────────
function exportData() {
  const exportObj = {
    vocab: data.vocab,
    structs: data.structs.filter(s => !s.id.startsWith('ss') && !s.id.startsWith('ts')), // only user-added
    topics: data.topics.filter(t => !['t1','t2','t3','t4','t5'].includes(t.id)), // only user-added
    exportedAt: new Date().toISOString(),
    version: 1
  };
  // Include ALL user data (vocab + custom structs/topics)
  const fullExport = { vocab: data.vocab, structs: data.structs, topics: data.topics, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(fullExport, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'english-vault-data.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('✓ Data exported! Send the .json file to your phone.');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported.vocab && !imported.structs) { alert('Invalid file format.'); return; }
      // Merge imported vocab (add new ones, skip duplicates by word)
      let addedVocab = 0;
      if (imported.vocab) {
        imported.vocab.forEach(v => {
          if (!data.vocab.find(x => x.id === v.id)) {
            data.vocab.unshift(v);
            addedVocab++;
          }
        });
      }
      // Merge structs
      let addedStructs = 0;
      if (imported.structs) {
        imported.structs.forEach(s => {
          if (!data.structs.find(x => x.id === s.id)) {
            data.structs.push(s);
            addedStructs++;
          }
        });
      }
      // Merge topics
      if (imported.topics) {
        imported.topics.forEach(t => {
          if (!data.topics.find(x => x.id === t.id)) data.topics.push(t);
        });
      }
      saveData();
      renderAll();
      toast(`✓ Imported: ${addedVocab} words, ${addedStructs} structures`);
    } catch(err) {
      alert('Could not read file. Make sure it\'s a valid English Vault export.');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

// Show sync bar on mobile
function initMobileUI() {
  if (window.innerWidth <= 768) {
    const bar = document.getElementById('syncBar');
    if (bar) bar.style.display = 'flex';
  }
}

// ─── THEME ────────────────────────────────────────────
function toggleTheme() {
  const isLight = document.documentElement.classList.toggle('light');
  document.getElementById('themeTrack').classList.toggle('on', isLight);
  document.getElementById('themeLabel').textContent = isLight ? 'Light mode' : 'Dark mode';
  try { localStorage.setItem('englishvault_theme', isLight ? 'light' : 'dark'); } catch(e) {}
}

function applyTheme() {
  let theme = 'light';
  try { theme = localStorage.getItem('englishvault_theme') || 'light'; } catch(e) {}
  if (theme === 'light') {
    document.documentElement.classList.add('light');
    document.getElementById('themeTrack').classList.add('on');
    document.getElementById('themeLabel').textContent = 'Light mode';
  }
}

// ─── INIT ─────────────────────────────────────────────
function renderAll() {
  updateSidebarStats();
  renderVocab();
  renderStructs();
  renderTopics();
  if (document.getElementById('panel-wordtypes').classList.contains('active')) renderWordTypes();
}

loadData();
renderAll();
applyTheme();
initMobileUI();
initSupabase();

// ── Nav touch handling ──
(function() {
  document.querySelectorAll('#mainNav .nav-item').forEach(function(btn) {
    var panel = btn.dataset.panel;
    if (!panel) return;
    btn.addEventListener('touchend', function(e) {
      e.preventDefault();
      showPanel(panel);
    }, { passive: false });
    btn.addEventListener('click', function() {
      showPanel(panel);
    });
  });
})();
</script>
